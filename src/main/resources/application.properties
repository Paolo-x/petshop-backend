# Nombre de la aplicacion
spring.application.name=petshop-backend
spring.profiles.default=dev

# Puerto del servidor
server.port=8080

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/petshop
spring.datasource.username=petshop_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Duración de cada JWT y límite total de la sesión (ISO-8601)
petshop.jwt.duracion=PT1H
petshop.jwt.duracion-maxima=PT8H

# Orígenes del frontend autorizados; separar por coma si se necesita más de uno
petshop.cors.origenes=http://localhost:5173
